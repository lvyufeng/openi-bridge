[project]
name = "openi-bridge"
version = "0.1.0"
description = "MCP server that opens and manages OpenI (启智社区) compute tasks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "openi", "启智社区", "gpu", "npu", "compute", "model-context-protocol"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Environment :: Console",
]
dependencies = [
  "mcp>=1.9.0",
  "httpx>=0.27.0",
  "websocket-client>=1.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  # The README's dsh snippet is YAML, and a test parses it to prove it is a
  # single valid document (the installer once produced two).
  "pyyaml>=6.0",
]

[project.scripts]
openi-bridge = "openi_bridge.server:main"
openi-autopoint = "openi_bridge.autopoint:main"
openi-run-on-card = "openi_bridge.exec_on_card:main"
openi-mcp-install = "openi_bridge.install_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openi_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

