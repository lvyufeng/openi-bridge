name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; 3.13 is the newest the
        # classifiers claim to support.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        # The suite is deliberately offline: it drives the client through stubs
        # and never resolves a token, so it runs with no secrets configured.
        # OPENI_TOKEN is unset on purpose -- if a test ever starts needing it,
        # this job fails rather than silently skipping.
        env:
          OPENI_TOKEN: ""
        run: pytest -q

  build:
    # a packaging break (missing licence file, bad metadata) should fail here
    # rather than at release time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl